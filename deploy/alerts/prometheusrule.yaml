# PrometheusRule for the TEE-V2 prometheus-multi-tenant-proxy (ETHOS-115242, US-007).
#
# This is the shippable alerting artifact. It is authored HERE but is deployed by
# the separate `ethos-core-prometheus-multi-tenant-proxy` Helm chart: drop the
# spec.groups body below into a chart templates/ file (the chart injects the
# operator's ruleSelector label, e.g. `release`/`prometheus`, and can template
# the `for`/`severity` values). The rule bodies are mirrored, byte-for-byte, in
# deploy/alerts/rules.yaml so that `promtool test rules` can validate them
# (promtool cannot parse this CRD wrapper directly).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: prometheus-multi-tenant-proxy
  namespace: monitoring
  labels:
    app.kubernetes.io/instance: prometheus-multi-tenant-proxy
    app.kubernetes.io/name: prometheus-multi-tenant-proxy
    app.kubernetes.io/component: proxy
    app.kubernetes.io/part-of: prometheus-multi-tenant-system
    role: alert-rules
spec:
  groups:
    - name: teev2-proxy-collection-health
      rules:
        # PRIMARY silent-stall signal (US-006 metric proxy_tenant_collection_up).
        # proxy_tenant_collection_up is only emitted for tenants that currently
        # have an enabled remote-write job (US-006 AC2), so `== 0` already implies
        # an onboarded tenant -- no extra "onboarded" guard is needed. max by keeps
        # only the identifying (namespace,name) labels and collapses per-replica
        # series (the proxy runs with multiple replicas + leader election).
        - alert: TEEV2ProxyTenantCollectionStalled
          expr: max by (namespace, name) (proxy_tenant_collection_up) == 0
          for: 15m
          labels:
            severity: warning
            service: prometheus-multi-tenant-proxy
            team: ethos-core
          annotations:
            summary: "TEE-V2 proxy tenant collection silently stalled ({{ $labels.namespace }}/{{ $labels.name }})"
            description: "Per-tenant remote-write collection for MetricAccess {{ $labels.namespace }}/{{ $labels.name }} has reported proxy_tenant_collection_up=0 for 15m. The tenant is onboarded (the metric only exists for tenants with an enabled remote-write job) but no series are being collected or forwarded - a silent stall."
            runbook: "Workaround: kubectl -n monitoring rollout restart deploy/prometheus-multi-tenant-proxy - see ETHOS-115242."

        # FALLBACK / corroborating signal for old images mid-rollout that predate
        # the US-006 proxy_tenant_collection_up metric. `up` is the per-target
        # scrape health series; metrics_path!="" restricts it to scraped
        # Prometheus-style targets. This is coarser (target-down, not per-tenant
        # stall) and is kept strictly SECONDARY -- prefer
        # TEEV2ProxyTenantCollectionStalled once every replica is on a
        # US-006-capable image.
        - alert: TEEV2ProxyTargetDown
          expr: up{metrics_path!=""} == 0
          for: 15m
          labels:
            severity: warning
            service: prometheus-multi-tenant-proxy
            team: ethos-core
          annotations:
            summary: "TEE-V2 proxy scrape target down (fallback for pre-US-006 images)"
            description: "Scrape target {{ $labels.namespace }}/{{ $labels.job }} (instance {{ $labels.instance }}) has been down for 15m. Corroborating fallback for images that predate proxy_tenant_collection_up; confirm the primary metric before acting. See ETHOS-115242."
            runbook: "Workaround: kubectl -n monitoring rollout restart deploy/prometheus-multi-tenant-proxy - see ETHOS-115242."

        # SECONDARY self-heal churn signals (informational). A steadily increasing
        # self-restart or per-tenant stall-recreation counter means the proxy is
        # papering over a recurring stall -- worth investigating even if the
        # primary alert is currently clear.
        - alert: TEEV2ProxySelfRestartChurn
          expr: increase(proxy_self_restart_total[1h]) > 0
          for: 5m
          labels:
            severity: info
            service: prometheus-multi-tenant-proxy
            team: ethos-core
          annotations:
            summary: "TEE-V2 proxy performed last-resort self-restarts in the last hour"
            description: "proxy_self_restart_total increased in the last hour (proxy-wide, no tenant label). Recurring last-resort restarts indicate a persistent underlying stall. See ETHOS-115242."

        - alert: TEEV2ProxyTenantStallRecreationChurn
          expr: increase(proxy_tenant_stall_recreations_total[1h]) > 0
          for: 5m
          labels:
            severity: info
            service: prometheus-multi-tenant-proxy
            team: ethos-core
          annotations:
            summary: "TEE-V2 proxy self-healed a stalled tenant job ({{ $labels.namespace }}/{{ $labels.name }})"
            description: "proxy_tenant_stall_recreations_total for {{ $labels.namespace }}/{{ $labels.name }} increased in the last hour; the self-heal watchdog is recreating a repeatedly-stalling collection job. See ETHOS-115242."
